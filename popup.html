<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wordle Timer</title>
  <style>
    body { font-family: Arial, sans-serif; width: 340px; margin: 0; padding: 14px; color: #111; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    button { margin-bottom: 12px; padding: 8px 12px; font-size: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 6px 8px; border: 1px solid #ddd; text-align: left; }
    th { background: #f2f2f2; }
    .status { margin-bottom: 8px; color: #555; }
    .result-status-solved { color: #007a1f; font-weight: 700; }
    .result-status-failed { color: #c62828; font-weight: 700; }
    .small { font-size: 12px; color: #666; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Wordle Timer</h1>
  <div class="status" id="status">Loading results...</div>
  <button id="refresh">Refresh results</button>
  <button id="clear-history" style="margin-left:8px;">Clear history</button>
  <table id="results">
    <thead>
      <tr><th>Date</th><th>Time</th><th><th>Status</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <script src="popup.js"></script>
</body>
</html>
